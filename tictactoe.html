<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
      background: #f4f4f8;
      color: #222;
    }
    h1 { margin-bottom: 8px; }
    #status { font-size: 1.2em; min-height: 1.5em; margin-bottom: 16px; }
    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 6px;
      background: #888;
      padding: 6px;
      border-radius: 8px;
    }
    .cell {
      background: #fff;
      border: none;
      border-radius: 4px;
      font-size: 2.5em;
      font-weight: bold;
      cursor: pointer;
    }
    .cell:hover:not(:disabled) { background: #e8eefc; }
    .cell:disabled { cursor: default; }
    .cell.win { background: #bde5b5; }
    button#reset {
      margin-top: 20px;
      padding: 8px 20px;
      font-size: 1em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status"></div>
  <div id="board"></div>
  <button id="reset">New game</button>

  <script>
    const WIN_LINES = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const resetBtn = document.getElementById("reset");

    let cells = [];
    let current = "X";
    let over = false;

    // Returns { winner, line } if someone has three in a row, otherwise null.
    function findWinner(cells) {
      for (const line of WIN_LINES) {
        const [a, b, c] = line;
        if (cells[a] && cells[a] === cells[b] && cells[a] === cells[c]) {
          return { winner: cells[a], line };
        }
      }
      return null;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function handleClick(index) {
      if (over || cells[index]) return;

      cells[index] = current;
      const buttons = boardEl.querySelectorAll(".cell");
      buttons[index].textContent = current;
      buttons[index].disabled = true;

      const result = findWinner(cells);
      if (result) {
        over = true;
        result.line.forEach(i => buttons[i].classList.add("win"));
        setStatus(`${result.winner} wins!`);
        disableAll();
        return;
      }

      if (cells.every(Boolean)) {
        over = true;
        setStatus("It's a draw.");
        return;
      }

      current = current === "X" ? "O" : "X";
      setStatus(`${current}'s turn`);
    }

    function disableAll() {
      boardEl.querySelectorAll(".cell").forEach(b => b.disabled = true);
    }

    function newGame() {
      cells = Array(9).fill(null);
      current = "X";
      over = false;
      boardEl.innerHTML = "";
      for (let i = 0; i < 9; i++) {
        const btn = document.createElement("button");
        btn.className = "cell";
        btn.addEventListener("click", () => handleClick(i));
        boardEl.appendChild(btn);
      }
      setStatus("X's turn");
    }

    resetBtn.addEventListener("click", newGame);
    newGame();
  </script>
</body>
</html>
